name: ${COMPOSE_PROJECT_NAME:-open-webui-stack}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./setup.sh first}
      POSTGRES_DB: postgres
      WEBUI_DB_PASSWORD: ${WEBUI_DB_PASSWORD:?Run ./setup.sh first}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?Run ./setup.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [data]

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc}
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run ./setup.sh first}
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [data]

  tika:
    image: ${TIKA_IMAGE:-apache/tika@sha256:80072bb73dd320a9de9709beb0b16d14dd6d2680376f8d31e498f55b633ba593}
    restart: unless-stopped
    networks: [data]

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.100.0@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: [--config, /app/config.yaml, --port, '4000']
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?Run ./setup.sh first}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Run ./setup.sh first}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Run ./setup.sh first}
      STORE_MODEL_IN_DB: 'True'
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?Run ./setup.sh first}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - '127.0.0.1:${LITELLM_PORT:-14000}:4000'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 12
    networks: [data, webui]

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui@sha256:c792953395b43d4f49085fa4026850c5e923578345ebeaf56eabd980bcfc273a}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_started
      tika:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://openwebui:${WEBUI_DB_PASSWORD:?Run ./setup.sh first}@postgres:5432/openwebui
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Run ./setup.sh first}
      WEBUI_URL: ${WEBUI_URL:-http://localhost:13000}
      CORS_ALLOW_ORIGIN: ${WEBUI_URL:-http://localhost:13000}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-admin@example.com}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?Run ./setup.sh first}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      ENABLE_SIGNUP: 'false'
      DEFAULT_USER_ROLE: pending
      ENABLE_OLLAMA_API: 'false'
      ENABLE_OPENAI_API: 'true'
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_WEBUI_KEY:-not-configured}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Run ./setup.sh first}
      QDRANT_COLLECTION_PREFIX: openwebui
      CONTENT_EXTRACTION_ENGINE: tika
      TIKA_SERVER_URL: http://tika:9998
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    ports:
      - '127.0.0.1:${OPEN_WEBUI_PORT:-13000}:8080'
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 12
    networks: [data, webui, edge, terminal]

  npm:
    profiles: [proxy]
    image: ${NPM_IMAGE:-jc21/nginx-proxy-manager:2.15.1}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DB_SQLITE_FILE: /data/database.sqlite
    ports:
      - '${PROXY_BIND:-127.0.0.1}:${PROXY_HTTP_PORT:-18080}:80'
      - '${PROXY_BIND:-127.0.0.1}:${PROXY_HTTPS_PORT:-18443}:443'
      - '127.0.0.1:${PROXY_ADMIN_PORT:-18081}:81'
    volumes:
      - npm-data:/data
      - npm-certificates:/etc/letsencrypt
    networks: [edge]

  ollama:
    profiles: [ollama]
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [webui]

  open-terminal:
    profiles: [terminal]
    image: ${OPEN_TERMINAL_IMAGE:-ghcr.io/open-webui/open-terminal@sha256:8f6d2045aa69e348e39d89bf59e6b267773532335333eed14ff16bbc7c964b73}
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?Run ./setup.sh first}
      OPEN_TERMINAL_FILE_BROWSER_ROOT: home
    volumes:
      - terminal-data:/home/user
    networks: [terminal]

networks:
  data:
    internal: true
  webui: {}
  edge: {}
  terminal: {}

volumes:
  postgres-data: {}
  open-webui-data: {}
  qdrant-data: {}
  npm-data: {}
  npm-certificates: {}
  ollama-data: {}
  terminal-data: {}
