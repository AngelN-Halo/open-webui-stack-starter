name: ${COMPOSE_PROJECT_NAME:-open-webui-stack}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./setup.sh first}
      POSTGRES_DB: postgres
      WEBUI_DB_PASSWORD: ${WEBUI_DB_PASSWORD:?Run ./setup.sh first}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?Run ./setup.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [data]

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac}
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run ./setup.sh first}
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [data]

  tika:
    image: ${TIKA_IMAGE:-apache/tika@sha256:0f0fbd7f053a2a9941b816ce6d6974493f5527f40c4d3491f9c2cecec30e612c}
    restart: unless-stopped
    networks: [data]

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.110.2@sha256:ef798594ca3db8d81bad2e1439f536f49b71fe095ee9f20416f5e149b4e22035}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: [--config, /app/config.yaml, --port, '4000']
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?Run ./setup.sh first}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Run ./setup.sh first}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Run ./setup.sh first}
      STORE_MODEL_IN_DB: 'True'
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?Run ./setup.sh first}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - '127.0.0.1:${LITELLM_PORT:-14000}:4000'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 12
    networks: [data, webui]

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.13.4@sha256:d5168bfbc28609eff5bea1b438dd864cf64d185cf6582c02244865e18385b901}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_started
      tika:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://openwebui:${WEBUI_DB_PASSWORD:?Run ./setup.sh first}@postgres:5432/openwebui
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Run ./setup.sh first}
      WEBUI_URL: ${WEBUI_URL:-http://localhost:13000}
      CORS_ALLOW_ORIGIN: ${WEBUI_URL:-http://localhost:13000}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-admin@example.com}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?Run ./setup.sh first}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      ENABLE_SIGNUP: 'false'
      DEFAULT_USER_ROLE: pending
      ENABLE_OLLAMA_API: 'false'
      ENABLE_OPENAI_API: 'true'
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_WEBUI_KEY:-not-configured}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Run ./setup.sh first}
      QDRANT_COLLECTION_PREFIX: openwebui
      CONTENT_EXTRACTION_ENGINE: tika
      TIKA_SERVER_URL: http://tika:9998
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    ports:
      - '127.0.0.1:${OPEN_WEBUI_PORT:-13000}:8080'
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 12
    networks: [data, webui, edge, terminal]

  npm:
    profiles: [proxy]
    image: ${NPM_IMAGE:-jc21/nginx-proxy-manager:2.17.1@sha256:04a9d0835560b9719ab577275f84fe1f713298a1c1e2bdefa034b87f10e062e1}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DB_SQLITE_FILE: /data/database.sqlite
    ports:
      - '${PROXY_BIND:-127.0.0.1}:${PROXY_HTTP_PORT:-18080}:80'
      - '${PROXY_BIND:-127.0.0.1}:${PROXY_HTTPS_PORT:-18443}:443'
      - '127.0.0.1:${PROXY_ADMIN_PORT:-18081}:81'
    volumes:
      - npm-data:/data
      - npm-certificates:/etc/letsencrypt
    networks: [edge]

  ollama:
    profiles: [ollama]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [webui]

  open-terminal:
    profiles: [terminal]
    image: ${OPEN_TERMINAL_IMAGE:-ghcr.io/open-webui/open-terminal@sha256:bc48e12e5f6d24714177281cf682a3959998c5a426f7b6df79a58e044470e6eb}
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?Run ./setup.sh first}
      OPEN_TERMINAL_FILE_BROWSER_ROOT: home
    volumes:
      - terminal-data:/home/user
    networks: [terminal]

networks:
  data:
    internal: true
  webui: {}
  edge: {}
  terminal: {}

volumes:
  postgres-data: {}
  open-webui-data: {}
  qdrant-data: {}
  npm-data: {}
  npm-certificates: {}
  ollama-data: {}
  terminal-data: {}
