:root{--bg:#fff;--text:#202b2b;--muted:#687676;--line:#e5eaea;--soft:#f7f9f9;--accent:#08786a;--tint:#edf8f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 'DM Sans',sans-serif}button,input{font:inherit}a{color:inherit;text-decoration:none}button,a,input{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 32px;position:sticky;top:0;background:var(--bg);z-index:20}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.8px;white-space:nowrap}.logo{width:29px;height:29px;background:#173e37;color:#8ce4bd;display:grid;place-items:center;border-radius:7px;font-family:monospace;font-size:24px}.version{font:11px 'IBM Plex Mono',monospace;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:5px;margin-left:4px}.toplinks{display:flex;gap:25px;margin-left:30px;height:100%;align-items:center;font-size:13px}.toplinks a:first-child{border-bottom:2px solid var(--accent);height:100%;display:flex;align-items:center;color:var(--accent)}.searchTrigger{margin-left:auto;width:260px;text-align:left;background:var(--soft);border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:7px;display:flex;align-items:center;gap:10px;font-size:13px}kbd{font:11px 'IBM Plex Mono';border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:auto}.github{font-size:13px;white-space:nowrap}.menu{display:none;background:none;border:0;font-size:23px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{border-right:1px solid var(--line);padding:32px 20px 24px 26px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;display:flex;flex-direction:column}.navgroup{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:#82908c;font-weight:600;margin:24px 12px 9px}.navgroup:first-child{margin-top:0}.navlink{display:flex;align-items:center;gap:11px;color:#61706c;font-size:13px;border-radius:6px;padding:7px 12px;margin:2px 0}.navlink.active{background:var(--tint);color:#076e59;font-weight:600}.navicon{width:17px;flex-shrink:0;white-space:nowrap;font-size:14px;color:#687e74}.navlink.active .navicon{color:var(--accent)}.sidebarfoot{margin-top:auto;padding:35px 12px 0;font-size:12px;color:var(--muted)}.sidebarfoot strong{color:var(--text);display:block;font-weight:500}.workspace{display:grid;grid-template-columns:minmax(0,790px) 180px;justify-content:center;gap:48px;padding:38px 48px 28px}.content{min-width:0}.breadcrumb{font-size:12px;color:var(--muted);display:flex;gap:12px;margin-bottom:28px}.breadcrumb span:last-child{color:var(--accent)}.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.6px;color:var(--accent);text-transform:uppercase;margin-bottom:9px}h1{font-size:43px;font-weight:600;letter-spacing:-1.9px;line-height:1.15;margin:0 0 18px}h2{font-size:23px;letter-spacing:-.6px;font-weight:600;margin:38px 0 12px;line-height:1.3;scroll-margin-top:100px}h3{font-size:15px;font-weight:600;margin:0 0 6px}.lead{font-size:17px;line-height:1.8;color:var(--muted);max-width:650px;margin:0 0 24px}p{color:var(--muted);margin:12px 0}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 27px}.tag{font:11px 'IBM Plex Mono';border:1px solid var(--line);padding:6px 9px;border-radius:5px;color:var(--muted)}.tag:first-child{color:var(--accent);background:var(--tint);border-color:#d8eee4}.actions{display:flex;gap:12px;margin-bottom:32px}.btn{border:1px solid var(--line);border-radius:6px;padding:9px 16px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:22px;background:var(--bg)}.btn.primary{background:#166a54;color:white;border-color:#166a54}.architecture{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:23px 24px 19px}.smalllabel{font:10px 'IBM Plex Mono';letter-spacing:1px;color:var(--muted);text-transform:uppercase}.flow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:21px 0}.node{background:var(--bg);border:1px solid var(--line);padding:13px 16px;border-radius:7px;flex:1;text-align:center;font-size:13px;line-height:1.4}.node strong{display:block;font-weight:600}.node small{font-size:10px;color:var(--muted)}.node.selected{border-color:#91bdab;background:var(--tint)}.arrow{color:#94a69c}.flowcaption{font-size:11px;color:var(--muted);text-align:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.card{border:1px solid var(--line);border-radius:8px;padding:21px;transition:border-color .15s,background .15s}.card:hover{border-color:#8cbda9;background:var(--soft)}.cardicon{color:var(--accent);font:21px 'IBM Plex Mono';margin-bottom:17px}.card p{font-size:13px;line-height:1.6;margin:5px 0 0}.card h3 span{float:right;color:#a0ada7}code{font:12px 'IBM Plex Mono',monospace;background:var(--soft);border:1px solid var(--line);padding:2px 5px;border-radius:4px;color:var(--text);overflow-wrap:anywhere}.codebox{background:#182220;color:#d5e2dc;border:1px solid #263a31;border-radius:8px;margin:18px 0;overflow:hidden}.codehead{background:#202d29;padding:9px 16px;font:11px 'IBM Plex Mono';color:#a6b9b0;display:flex;justify-content:space-between;align-items:center}.copy{color:#c2d6cb;background:transparent;border:0;font-size:11px}.codebox pre{padding:17px 20px;margin:0;overflow:auto;font:12px/1.9 'IBM Plex Mono',monospace;tab-size:2}.codebox code{background:none;border:0;color:inherit;padding:0;white-space:pre;overflow-wrap:normal}.note{display:flex;gap:12px;background:var(--tint);border:1px solid #dcece4;border-radius:7px;padding:14px 17px;font-size:12px;color:#3c6a58;margin:22px 0}.note strong{font-weight:600}.note p{margin:0;color:inherit}.sectionrule{border-top:1px solid var(--line);margin-top:34px}.toc{position:sticky;top:112px;height:fit-content;font-size:12px;padding-top:7px}.toc strong{display:block;font-size:11px;font-weight:600;margin-bottom:15px}.toc a{display:block;border-left:1px solid var(--line);padding:6px 0 6px 14px;color:var(--muted)}.toc a:hover{color:var(--accent);border-color:var(--accent)}.toc .help{border-top:1px solid var(--line);margin-top:30px;padding-top:20px;color:var(--muted);font-size:11px}.help a{border:0;padding:6px 0;color:var(--accent)}footer{border-top:1px solid var(--line);margin-top:34px;padding-top:18px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:12px}.next{border:1px solid var(--line);padding:16px 20px;border-radius:8px;display:block;text-align:right;margin:25px 0}.next small{display:block;color:var(--muted);font-size:11px}.next strong{font-size:14px;font-weight:500;color:var(--accent)}table{border-collapse:collapse;width:100%;font-size:12px;margin:18px 0}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-weight:500}td{color:var(--muted)}li{color:var(--muted);margin:7px 0}.get{font:10px 'IBM Plex Mono';color:var(--accent);background:var(--tint);padding:3px 5px;margin-right:8px;border-radius:4px}.endpoint{padding:16px;border:1px solid var(--line);border-radius:7px;margin:12px 0}.endpoint p{font-size:13px;margin-bottom:0}.endpoint code{border:0;background:none}.tablewrap{overflow-x:auto}dialog{padding:0;border:1px solid var(--line);border-radius:12px;width:min(600px,90vw);color:var(--text);box-shadow:0 30px 90px #0003}dialog::backdrop{background:#14282066;backdrop-filter:blur(3px)}.searchbar{display:flex;border-bottom:1px solid var(--line);padding:17px;gap:12px}.searchbar input{border:0;outline:0;width:100%;background:transparent;color:inherit}.searchbar button{border:0;background:var(--soft);border-radius:4px;color:var(--muted)}#results{padding:10px;max-height:55vh;overflow:auto}#results a{display:block;padding:12px;border-radius:6px}#results a:hover{background:var(--tint)}#results small{display:block;color:var(--muted)}.skip{position:fixed;top:-100px;background:var(--bg);padding:10px;z-index:40}.skip:focus{top:0}@media(min-width:1450px){.workspace{padding-top:46px}}@media(max-width:1150px){.workspace{grid-template-columns:minmax(0,1fr);padding:35px}.toc{display:none}.toplinks{margin-left:0}.searchTrigger{width:220px}}@media(max-width:850px){header{padding:0 20px;gap:15px;height:65px}.toplinks{display:none}.layout{grid-template-columns:205px 1fr}.sidebar{top:65px;height:calc(100vh - 65px);padding-left:12px;padding-right:12px}.workspace{padding:30px 25px}.brand{font-size:17px}.version{display:none}.searchTrigger{width:190px}h1{font-size:36px}.cards{grid-template-columns:1fr}.flow{gap:5px}.node{padding:12px 8px}.architecture{padding:18px 12px}}@media(max-width:650px){.menu{display:block}.github{display:none}.searchTrigger{width:36px;padding:7px;justify-content:center}.searchTrigger span,.searchTrigger kbd{display:none}.layout{display:block}.sidebar{display:none;position:fixed;top:65px;left:0;width:250px;z-index:19;background:var(--bg);box-shadow:20px 0 45px #0002}.sidebar.open{display:flex}.workspace{padding:26px 22px}.breadcrumb{margin-bottom:25px}h1{font-size:36px}.lead{font-size:16px}.flow{flex-direction:column}.node{width:100%}.arrow{transform:rotate(90deg)}.actions{flex-wrap:wrap}.cards{grid-template-columns:1fr}.architecture{padding:20px}.sidebarfoot{margin-top:30px}footer{flex-direction:column}.tag{font-size:10px}}
</style></head><body><a class="skip" href="#main">Skip to content</a><header><button class="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><a href="#overview" class="brand"><span class="logo" aria-hidden="true">⌘</span>Stack Starter <span class="version">Docs</span></a><nav class="toplinks"><a href="#overview">Documentation</a><a href="https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/README.md" target="_blank" rel="noopener noreferrer">README ↗</a></nav><button class="searchTrigger" aria-label="Search documentation">⌕ <span>Search documentation…</span><kbd>⌘ K</kbd></button><a class="github" href="https://github.com/AngelN-Halo/open-webui-stack-starter" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header><div class="layout"><nav class="sidebar" aria-label="Documentation"></nav><div class="workspace"><main id="main" class="content" tabindex="-1"></main><aside class="toc" aria-label="On this page"></aside></div></div><dialog id="searchDialog"><div class="searchbar"><input id="searchInput" type="search" placeholder="Search the documentation…" aria-label="Search query"><button id="closeSearch" aria-label="Close search">Esc</button></div><div id="results"></div></dialog><noscript><p><a href="https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/README.md">Read the full guide on GitHub</a> when JavaScript is disabled.</p></noscript><div id="announce" aria-live="polite" style="position:absolute;left:-10000px"></div><script>
const repo='https://github.com/AngelN-Halo/open-webui-stack-starter';
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const code=(s,label='terminal')=>`<div class="codebox"><div class="codehead"><span>${label}</span><button class="copy" aria-label="Copy ${label} code">Copy ⧉</button></div><pre><code>${esc(s)}</code></pre></div>`;
const note=s=>`<div class="note"><span aria-hidden="true">ⓘ</span><p>${s}</p></div>`;
const card=(id,icon,title,text)=>`<a class="card" href="#${id}"><div class="cardicon">${icon}</div><h3>${title}<span>↗</span></h3><p>${text}</p></a>`;
const pages={"overview": {"title": "Your AI workspace. One stack.", "nav": "Introduction", "group": "Getting started", "description": "Chat, model routing, document search, and optional local tools in one fresh-install Docker Compose stack.", "icon": "›", "html": "<div class=\"tags\"><span>Fresh installation</span><span>Generated credentials</span><span>Optional local models</span></div><div class=\"actions\"><a class=\"btn primary\" href=\"#setup\">Set up the stack →</a><a class=\"btn\" href=\"#models\">Connect a model →</a></div><div class=\"architecture\"><div class=\"smalllabel\">The core stack</div><div class=\"flow\"><div class=\"node\"><strong>Open WebUI</strong><small>Chat and knowledge</small></div><span class=\"arrow\">→</span><div class=\"node selected\"><strong>LiteLLM</strong><small>Model gateway</small></div><span class=\"arrow\">→</span><div class=\"node\"><strong>Your model</strong><small>Provider or optional Ollama</small></div></div><p>PostgreSQL stores application data. Tika extracts document text, and Qdrant stores document vectors.</p></div><h2 id=\"start\">From fresh install to first chat.</h2><ol><li>Generate private configuration.</li><li>Start the core services.</li><li>Connect a model and restrict its key.</li><li>Verify chat and document processing.</li></ol><div class=\"note\"><p>This starter creates a new installation. It does not migrate existing data, include model-provider access, or configure a model automatically.</p></div><h2 id=\"guides\">Everything you need, in one place.</h2><div class=\"cards\"><a class=\"card\" href=\"#setup\"><h3>Installation</h3><p>Requirements, fresh credentials, service startup, and remote access.</p></a><a class=\"card\" href=\"#documents\"><h3>Document search</h3><p>Check extraction, embeddings, and citations with a public test document.</p></a><a class=\"card\" href=\"#optional\"><h3>Optional features</h3><p>HTTPS, Ollama, Open Terminal, and separate browser tools.</p></a><a class=\"card\" href=\"#maintenance\"><h3>Maintain the stack</h3><p>Preserve data, back up secrets, and plan updates deliberately.</p></a></div>"}, "architecture": {"title": "How the services fit together", "nav": "Architecture", "group": "Getting started", "description": "Understand the application, model, and document-processing paths.", "icon": "›", "html": "<div class=\"architecture\"><div class=\"flow\"><div class=\"node\"><strong>Browser</strong></div><span class=\"arrow\">→</span><div class=\"node selected\"><strong>Open WebUI</strong></div><span class=\"arrow\">→</span><div class=\"node\"><strong>LiteLLM → model</strong></div></div><p>Document path: Open WebUI → Tika for extraction; Open WebUI → Qdrant for embeddings. Open WebUI and LiteLLM use separate PostgreSQL databases.</p></div><p>Open WebUI sends model requests through LiteLLM, extracts documents with Tika,\nand stores embeddings in Qdrant. For exact network attachments, <a href=\"https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/compose.yaml\">compose.yaml</a> defines the exact networks.</p>\n<p>PostgreSQL uses separate non-superuser application roles. Data services have no\nhost ports. Volumes and networks belong to the selected Compose project; no\nlive deployment's explicit volume or container names are reused.</p>"}, "setup": {"title": "Install a fresh stack", "nav": "Installation", "group": "Getting started", "description": "Generate your own configuration, then start the core services.", "icon": "›", "html": "<h2 id=\"requirements\">Requirements</h2>\n<ul>\n<li>Linux Docker host with Docker Engine and Compose v2, Bash, Python 3, and Git.</li>\n<li>Permission to use Docker. Check <code>docker info</code> and <code>docker compose version</code>.</li>\n<li>Internet access for images and providers; Open WebUI may download its default\n  embedding model on first use. Local inference needs additional RAM and disk.</li>\n<li>An existing provider account or a local model configured in optional Ollama.</li>\n<li>SSH access if viewing the host's localhost-only services from another computer.</li>\n</ul>\n<p>This does not install Docker, buy provider access, download an Ollama model, or\nconfigure a domain automatically. See <a href=\"https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/SECURITY.md\">SECURITY.md</a> before exposing\nanything publicly and <a href=\"https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/THIRD-PARTY.md\">THIRD-PARTY.md</a> for image/license details.</p>\n<h2 id=\"1-generate-private-configuration\">1. Generate private configuration</h2>\n<p>Run on your Docker host. Clone the repository, then generate your own credentials:</p>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>git clone https://github.com/AngelN-Halo/open-webui-stack-starter.git open-webui-stack\ncd open-webui-stack\n./setup.sh --admin-email admin@example.com\n</code></pre></div>\n<p>If you already have a checkout, enter its directory and run setup there. All\nsubsequent Compose commands run from this directory unless stated otherwise.</p>\n<p>Replace the example email with your administrator email. Setup creates <code>.env</code>\nwith independent random passwords and keys (mode 0600), then validates Compose.\nIt never overwrites an existing <code>.env</code> and never starts services. Open <code>.env</code> in\nyour local editor to review ports and record the generated login credentials\nprivately. Do not paste <code>.env</code> or unredacted Compose output into bug reports.</p>\n<p>The defaults use project <code>open-webui-stack</code>, Open WebUI port 13000, and LiteLLM\nport 14000, all on host loopback. For another installation:</p>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>./setup.sh --project-name my-ai-stack --admin-email admin@example.com\n</code></pre></div>\n<p>Choose a unique project name before first startup and different host ports for\neach installation. Changing the project name later selects different volumes;\nyour existing accounts/data do not move. Shell environment variables override\n<code>.env</code>; avoid stale exported passwords, ports or project names.</p>\n<p>Set <code>WEBUI_URL</code> to the browser URL you actually use, including any custom port.\nIt also sets the allowed browser origin; the starter does not default to wildcard\nCORS access.</p>\n<p>Keep generated database passwords as hexadecimal strings. Custom passwords used\nin connection URLs need correct URL encoding; raw punctuation can break a URL.</p>\n<h2 id=\"2-start-the-core-stack\">2. Start the core stack</h2>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker compose pull\ndocker compose up -d --wait --wait-timeout 600\ndocker compose ps -a\ndocker compose logs --tail=100\n</code></pre></div>\n<p>First startup initializes two databases and applies application migrations.\nThe command waits for application health checks and can take several minutes.\nOpen WebUI waits for PostgreSQL and LiteLLM readiness. Tika and Qdrant may take\nadditional time to become ready; the check script in the Document processing guide verifies them explicitly.</p>\n<p>On the Docker host, open:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Service</th>\n<th>URL</th>\n<th>Login</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Open WebUI</td>\n<td><code>http://localhost:13000</code></td>\n<td><code>WEBUI_ADMIN_EMAIL</code> / <code>WEBUI_ADMIN_PASSWORD</code></td>\n</tr>\n<tr>\n<td>LiteLLM Admin UI</td>\n<td><code>http://localhost:14000/ui</code></td>\n<td><code>admin</code> / <code>LITELLM_UI_PASSWORD</code></td>\n</tr>\n</tbody>\n</table></div>\n<p>For a remote host, run this on your workstation and keep it running:</p>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>ssh -N -o ExitOnForwardFailure=yes -L 127.0.0.1:13000:127.0.0.1:13000 -L 127.0.0.1:14000:127.0.0.1:14000 USER@DOCKER_HOST\n</code></pre></div>\n<p>Then use the same localhost URLs on your workstation. Replace the SSH placeholders\nand adjust tunnel ports if you changed <code>.env</code> or your local ports are occupied.</p>"}, "configuration": {"title": "Passwords, keys & configuration", "nav": "Configuration", "group": "Getting started", "description": "Setup generates independent random secrets. Provider credentials and the restricted Open WebUI model key are separate steps.", "icon": "›", "html": "<h2 id=\"what-setup-generates\">What setup generates</h2>\n<p><code>./setup.sh --admin-email admin@example.com</code> creates <code>.env</code> with mode <code>0600</code>. It generates the administrator password, separate database passwords, application secrets, the Qdrant key, LiteLLM administrator credentials, and the optional Open Terminal key.</p>\n<p>It preserves an existing <code>.env</code>, including symlinks, and does not start containers. It does not create model-provider credentials or a restricted LiteLLM virtual key for Open WebUI. Create that virtual key after connecting your model.</p>\n<h2 id=\"environment-reference\">Environment reference</h2>\n<p>Edit the local <code>.env</code> before first startup. Image overrides are optional; the\ntested defaults are recorded in <code>compose.yaml</code>.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Purpose</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>COMPOSE_PROJECT_NAME</code></td>\n<td>Unique installation name and prefix for networks/volumes</td>\n</tr>\n<tr>\n<td><code>OPEN_WEBUI_PORT</code>, <code>LITELLM_PORT</code></td>\n<td>Host loopback ports; defaults 13000 and 14000</td>\n</tr>\n<tr>\n<td><code>WEBUI_URL</code></td>\n<td>Full browser-facing URL, also used as the allowed browser origin</td>\n</tr>\n<tr>\n<td><code>WEBUI_ADMIN_EMAIL</code>, <code>WEBUI_ADMIN_PASSWORD</code></td>\n<td>First-install Open WebUI administrator login</td>\n</tr>\n<tr>\n<td><code>WEBUI_SECRET_KEY</code></td>\n<td>Persistent application secret; preserve with backups</td>\n</tr>\n<tr>\n<td><code>POSTGRES_PASSWORD</code></td>\n<td>Database administrator password; not used by applications</td>\n</tr>\n<tr>\n<td><code>WEBUI_DB_PASSWORD</code>, <code>LITELLM_DB_PASSWORD</code></td>\n<td>Independent application database passwords</td>\n</tr>\n<tr>\n<td><code>QDRANT_API_KEY</code></td>\n<td>Shared by Qdrant and its Open WebUI client</td>\n</tr>\n<tr>\n<td><code>LITELLM_UI_PASSWORD</code></td>\n<td>LiteLLM administrator UI password for username <code>admin</code></td>\n</tr>\n<tr>\n<td><code>LITELLM_MASTER_KEY</code></td>\n<td>Privileged gateway API key; keep out of ordinary client applications</td>\n</tr>\n<tr>\n<td><code>LITELLM_SALT_KEY</code></td>\n<td>Encryption secret for stored provider credentials; preserve with backups</td>\n</tr>\n<tr>\n<td><code>LITELLM_WEBUI_KEY</code></td>\n<td>Optional first-boot virtual key; normally configured in Open WebUI's Admin UI</td>\n</tr>\n<tr>\n<td><code>COMPOSE_PROFILES</code></td>\n<td>Optional comma-separated <code>proxy,ollama,terminal</code> selection</td>\n</tr>\n<tr>\n<td><code>PROXY_BIND</code>, <code>PROXY_*_PORT</code></td>\n<td>Optional proxy host bindings; administration always uses loopback</td>\n</tr>\n<tr>\n<td><code>OPEN_TERMINAL_API_KEY</code></td>\n<td>Bearer key for the optional terminal integration</td>\n</tr>\n</tbody>\n</table></div>\n<p>The generated administrator password is for a fresh database only. If <code>.env</code>\nalready exists, rerunning setup with another email or project name leaves it\nunchanged; edit it before the first launch or use the application's account\nsettings after initialization.</p>"}, "models": {"title": "Connect your first model", "nav": "Model connection", "group": "Guides", "description": "Route model requests through LiteLLM and give Open WebUI a restricted virtual key.", "icon": "›", "html": "<h2 id=\"configure-the-connection\">Configure the connection</h2>\n<p>The initial model list is empty. A healthy stack does not imply that a model is\nconfigured or that provider access is free.</p>\n<ol>\n<li>Sign into LiteLLM, add a provider/model under Models + Endpoints, and test it.\n   Provider credentials are stored in PostgreSQL encrypted using <code>LITELLM_SALT_KEY</code>.</li>\n<li>Create a virtual key for Open WebUI. Restrict its model access, rate limits and\n   budget. Copy it privately; do not give Open WebUI the LiteLLM master key.</li>\n<li>In Open WebUI's administrator connection settings, edit the OpenAI-compatible\n   connection. Use URL <code>http://litellm:4000/v1</code> and the virtual key.</li>\n<li>Refresh models, select one in a new chat and send a short test message.</li>\n</ol>\n<p>The connection URL is already seeded by Compose. <code>LITELLM_WEBUI_KEY</code> can seed a\nkey on first boot, but after setup use the Admin UI: Open WebUI persists many\nsettings in its database, so later <code>.env</code> changes may not override them.</p>\n<p>See <a href=\"https://docs.litellm.ai/docs/proxy/docker_quick_start\">LiteLLM's setup guide</a>\nand <a href=\"https://docs.openwebui.com/reference/env-configuration/\">Open WebUI's configuration reference</a>.</p>\n<h2 id=\"local-models\">Local models</h2>\n<p>For optional Ollama setup, see the Optional features page. Self-hosting the interface does not ensure local inference: the provider route you select determines where prompts are processed.</p>"}, "documents": {"title": "Search your documents", "nav": "Document processing", "group": "Guides", "description": "Verify extraction, embeddings, and answer citations separately.", "icon": "›", "html": "<h2 id=\"verify-the-document-path\">Verify the document path</h2>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>./scripts/check.sh\n</code></pre></div>\n<p>This checks service health, PostgreSQL role boundaries, authenticated Qdrant\naccess, Tika and LiteLLM connectivity. It does not call a paid model or inspect\nyour chats. Then upload a small public text/PDF document into Open WebUI Knowledge\nand ask a question whose answer appears in it. Verify ingestion and citations.\nThe default embedding model may download on first use; a chat model alone does\nnot configure embeddings. Change embedding models deliberately and reindex\naffected collections rather than mixing vector dimensions.</p>"}, "optional": {"title": "Add only what you need", "nav": "Optional features", "group": "Guides", "description": "Enable HTTPS, local inference, terminal access, or a separate browser workspace.", "icon": "›", "html": "<p>Profiles can be enabled permanently in <code>.env</code>, for example\n<code>COMPOSE_PROFILES=proxy,ollama</code>. Run <code>docker compose up -d</code> afterward. Removing a\nprofile from <code>.env</code> alone does not stop containers previously started with it.</p>\n<p>To stop an optional service explicitly, use its matching command:</p>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker compose --profile proxy stop npm\ndocker compose --profile ollama stop ollama\ndocker compose --profile terminal stop open-terminal\n</code></pre></div>\n<p>Stopping retains the service's data. To resume, use its <code>up -d</code> command below.</p>\n<h3 id=\"nginx-proxy-manager\">Nginx Proxy Manager</h3>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker compose --profile proxy up -d npm\n</code></pre></div>\n<p>Open <code>http://localhost:18081</code> on the host or forward that port through SSH.\nComplete the initial account setup for the selected NPM release. Add a Proxy Host\npointing to <code>http://open-webui:8080</code>, enable WebSocket support, and configure HTTPS.\nNPM keeps its own SQLite database and certificate volume; it cannot directly\nreach PostgreSQL, Qdrant or Tika through the data network.</p>\n<p>For public HTTPS, set <code>PROXY_BIND=0.0.0.0</code>, <code>PROXY_HTTP_PORT=80</code> and\n<code>PROXY_HTTPS_PORT=443</code>, check that those ports are free, configure DNS/firewall\nrules and set <code>WEBUI_URL</code> to your HTTPS URL (also update it in the Admin UI if\nalready initialized). Port 81 administration remains on localhost. Default\n18080/18443 bindings are for local testing, not HTTP-based certificate validation.\nAn existing reverse proxy can be used instead of starting another NPM instance.\nSee <a href=\"https://nginxproxymanager.com/setup/\">NPM setup</a>.</p>\n<h3 id=\"ollama\">Ollama</h3>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker compose --profile ollama up -d ollama\ndocker compose exec ollama ollama pull YOUR_MODEL\n</code></pre></div>\n<p>Choose a model that fits your hardware and license requirements. In LiteLLM,\nconfigure the Ollama provider with API base <code>http://ollama:11434</code>, the model you\npulled, and a friendly model alias. Permit that alias on the Open WebUI virtual\nkey. This default is CPU-only; GPU passthrough requires host-specific setup.\nNo Ollama host port is published. Open WebUI connects through LiteLLM.</p>\n<h3 id=\"open-terminal\">Open Terminal</h3>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker compose --profile terminal up -d open-terminal\n</code></pre></div>\n<p>In Open WebUI's administrator Open Terminal integration settings, add\n<code>http://open-terminal:8000</code>, schema <code>/openapi.json</code>, Bearer authentication and\nthe generated <code>OPEN_TERMINAL_API_KEY</code>. Keep access administrator-only. Its home\ndirectory persists in <code>terminal-data</code>; it is shared, not isolated per user.</p>\n<h3 id=\"browser-tools\">Browser tools</h3>\n<p>Use the separately published <a href=\"https://github.com/AngelN-Halo/open-webui-browser-workspace\">Browser Workspace</a>\nfor either headless or visible Chromium. This avoids maintaining two diverging\ncopies of the browser service definitions.</p>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>git clone https://github.com/AngelN-Halo/open-webui-browser-workspace.git ../open-webui-browser-workspace\ncd ../open-webui-browser-workspace/addons/visible-browser\nOPEN_WEBUI_NETWORK=open-webui-stack_webui ./setup.sh\n</code></pre></div>\n<p>Use <code>addons/headless-browser</code> instead for headless mode. If you changed the stack's\nproject name, replace <code>open-webui-stack</code> in the network name. If the add-on already\nhas <code>.env</code>, edit <code>OPEN_WEBUI_NETWORK</code> there: setup will not overwrite it. Continue\nwith that repository's build/start and Open WebUI registration instructions.\nFor multiple browser deployments, give each its own Compose project name and\nvisible profile volume; defaults in the separate repository are single-instance.</p>"}, "maintenance": {"title": "Keep your data recoverable", "nav": "Maintenance & backups", "group": "Operations", "description": "Preserve application data and secrets together, and test recovery in a separate installation.", "icon": "›", "html": "<h2 id=\"database-initialization-and-maintenance\">Database initialization and maintenance</h2>\n<p><code>db/init/01-create-databases.sh</code> creates <code>openwebui</code> and <code>litellm</code>, each owned by\nits corresponding restricted login. Passwords come from <code>.env</code>; no SQL contains\nliteral credentials. PostgreSQL runs this only on an empty data volume. Each\napplication then creates/migrates its own tables.</p>\n<p>Editing <code>.env</code> does not alter existing PostgreSQL passwords, application admin\npasswords, or already-encrypted provider credentials. For password rotation,\nupdate the database role and its client configuration together. Preserve\n<code>WEBUI_SECRET_KEY</code> and <code>LITELLM_SALT_KEY</code> with backups. Never delete the database\nvolume just to apply new credentials. See <a href=\"https://hub.docker.com/_/postgres\">PostgreSQL initialization</a>.</p>\n<p>Stop and resume without removing data:</p>\n<div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker compose stop\ndocker compose start\n</code></pre></div>\n<p><code>docker compose down</code> removes containers/networks but retains named volumes.\nAdding <code>--volumes</code> deletes data: do not use it on an installation you intend to\nkeep. Optional services may require their profiles enabled for Compose operations.</p>\n<p>Before updates, back up both PostgreSQL databases, Open WebUI files, Qdrant\ncollections and <code>.env</code> as one recoverable set. Include optional terminal data,\nproxy database/certificates and browser profile volumes when used. Use PostgreSQL\nlogical dumps and Qdrant snapshots or a consistent stopped-stack backup; copying\nlive database files is not a reliable backup. Encrypt archives and test restoring\ninto a separate project. No destructive demo-reset scripts are included.</p>"}, "upgrades": {"title": "Upgrade deliberately", "nav": "Upgrades", "group": "Operations", "description": "Image downloads, source updates, and service recreation are separate steps.", "icon": "›", "html": "<h2 id=\"upgrade-procedure\">Upgrade procedure</h2>\n<ol>\n<li>Read upstream release notes and migration instructions. Record the current\n   image references and preserve the recoverable backup set described above.</li>\n<li>Choose a release and preferably its digest for each changed service. Set its\n   override in your private <code>.env</code>. For example, <code>OPEN_WEBUI_IMAGE</code> replaces the\n   complete Open WebUI image reference; use an actual verified release/digest,\n   not the instructional placeholders in <code>.env.example</code>.</li>\n<li>Test a separate project with different ports and isolated volumes. Restore a\n   backup into that separate project when you need to test data migration.</li>\n<li>During your maintenance window, run from the installation directory:</li>\n</ol>\n<p><code>bash\n   docker compose config --quiet\n   docker compose pull\n   docker compose up -d --wait --wait-timeout 600\n   ./scripts/check.sh</code></p>\n<ol>\n<li>Confirm administrator login, a real model request, document ingestion and\n   restart persistence. Check enabled optional integrations too. Keep the previous\n   backup until the new release has been accepted.</li>\n</ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Service</th>\n<th>Override in <code>.env</code></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Open WebUI</td>\n<td><code>OPEN_WEBUI_IMAGE</code></td>\n</tr>\n<tr>\n<td>LiteLLM</td>\n<td><code>LITELLM_IMAGE</code></td>\n</tr>\n<tr>\n<td>PostgreSQL</td>\n<td><code>POSTGRES_IMAGE</code></td>\n</tr>\n<tr>\n<td>Qdrant</td>\n<td><code>QDRANT_IMAGE</code></td>\n</tr>\n<tr>\n<td>Tika</td>\n<td><code>TIKA_IMAGE</code></td>\n</tr>\n<tr>\n<td>Nginx Proxy Manager</td>\n<td><code>NPM_IMAGE</code></td>\n</tr>\n<tr>\n<td>Ollama</td>\n<td><code>OLLAMA_IMAGE</code></td>\n</tr>\n<tr>\n<td>Open Terminal</td>\n<td><code>OPEN_TERMINAL_IMAGE</code></td>\n</tr>\n</tbody>\n</table></div>\n<p>Enable your optional profiles for the pull/update commands, either through\n<code>COMPOSE_PROFILES</code> or the matching <code>--profile</code> flags. <code>git pull --ff-only</code> updates\nrepository files; <code>docker compose pull</code> downloads images; <code>docker compose up -d</code>\napplies configuration and recreates changed services. They are separate steps.\nLocal image overrides continue to override new defaults from the repository.</p>\n<blockquote>\n<p><strong>WARNING</strong>\nPostgreSQL major-version upgrades require a database upgrade procedure and may\nrequire a different mount layout. Do not simply change <code>16</code> to another major.\nApplication migrations may also prevent downgrades: restoring an old image\nalone is not a reliable rollback. Restore the matching data backup when required.</p>\n</blockquote>"}, "versions": {"title": "Pinned defaults & tested scope", "nav": "Versions & validation", "group": "Reference", "description": "The repository records what was tested; shipped versions are not a claim about the latest releases.", "icon": "›", "html": "<h2 id=\"versions-and-update-policy\">Versions and update policy</h2>\n<blockquote>\n<p><strong>IMPORTANT</strong>\n<strong>This starter does not automatically install the newest releases.</strong> Most images\nare pinned by immutable digest. <code>docker compose pull</code> fetches the configured\nimage; it does not select a newer application version or restart containers.</p>\n</blockquote>\n<p>Version inventory checked <strong>2026-09-11</strong>. These are the shipped defaults, not a\nlist of the latest upstream releases. Your <code>.env</code> image overrides take precedence.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Component</th>\n<th>Version in the default image</th>\n<th>Pin</th>\n<th>Validation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Open WebUI</td>\n<td><strong>0.11.1</strong></td>\n<td>SHA-256 digest</td>\n<td>Core runtime tested</td>\n</tr>\n<tr>\n<td>LiteLLM</td>\n<td><strong>1.100.0</strong> release reference</td>\n<td>Release tag + SHA-256 digest</td>\n<td>Core runtime tested</td>\n</tr>\n<tr>\n<td>PostgreSQL</td>\n<td><strong>16.15</strong></td>\n<td>Major tag <code>16</code> + SHA-256 digest</td>\n<td>Core runtime tested</td>\n</tr>\n<tr>\n<td>Qdrant</td>\n<td><strong>1.19.0</strong></td>\n<td>SHA-256 digest</td>\n<td>Core runtime tested</td>\n</tr>\n<tr>\n<td>Apache Tika</td>\n<td><strong>4.0.0</strong></td>\n<td>SHA-256 digest</td>\n<td>Core runtime tested</td>\n</tr>\n<tr>\n<td>Nginx Proxy Manager</td>\n<td><strong>2.15.1</strong> release reference</td>\n<td>Release tag only</td>\n<td>Optional; configuration checked</td>\n</tr>\n<tr>\n<td>Ollama</td>\n<td><strong>0.30.10</strong> client</td>\n<td>SHA-256 digest</td>\n<td>Optional; configuration and version checked</td>\n</tr>\n<tr>\n<td>Open Terminal</td>\n<td><strong>0.12.3</strong></td>\n<td>SHA-256 digest</td>\n<td>Optional; configuration and version checked</td>\n</tr>\n</tbody>\n</table></div>\n<p>The full image references are in <a href=\"https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/compose.yaml\">compose.yaml</a>. Versions were\nidentified from runtime output, image/package metadata, or the stated release\nreference. Optional version checks do not mean those integrations were tested\nend to end. See <a href=\"https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/VALIDATION.md\">VALIDATION.md</a> for the exact scope.</p>\n<p>A digest fixes image content, even if the reference also includes a tag such as\n<code>16</code>. A tag alone can be reassigned upstream, so NPM's release-tag pin is less\nstrict than the other pins. None of these pins automatically receives security\nupdates. Review releases regularly and follow <a href=\"https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/README.md#upgrading-deliberately\">the upgrade procedure</a>.\nSee <a href=\"https://docs.docker.com/dhi/explore/security-concepts/digests/\">Docker's explanation of image digests</a>.</p>\n<h2 id=\"validation-record\">Validation record</h2>\n<p>Validated on 2026-09-11 on a Linux x86-64 Docker host. Testing used a separate\nCompose project, new volumes, and dynamically allocated localhost ports.\nThe existing deployment was not reconfigured or restarted.</p>\n<h3 id=\"coverage-at-a-glance\">Coverage at a glance</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>Result</th>\n<th>What that means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Setup and configuration</td>\n<td>✅ Passed</td>\n<td>Secret generation, source checks, all Compose profiles</td>\n</tr>\n<tr>\n<td>Core services</td>\n<td>✅ Passed</td>\n<td>Fresh initialization, authentication, database isolation</td>\n</tr>\n<tr>\n<td>Document processing</td>\n<td>✅ Passed</td>\n<td>Synthetic extraction, embeddings and restart persistence</td>\n</tr>\n<tr>\n<td>Provider inference</td>\n<td>⬜ Not tested</td>\n<td>Real model calls, chat citations and key budgets remain deployment checks</td>\n</tr>\n<tr>\n<td>Optional integrations</td>\n<td>◐ Partial</td>\n<td>Configuration checked; no end-to-end proxy, Ollama, terminal or browser test</td>\n</tr>\n<tr>\n<td>Upgrade and recovery</td>\n<td>⬜ Not tested</td>\n<td>Major upgrades and backup restoration need separate validation</td>\n</tr>\n</tbody>\n</table></div>\n<p>The <a href=\"https://github.com/AngelN-Halo/open-webui-stack-starter/blob/main/README.md#versions-and-update-policy\">README version table</a> identifies the\ndefault images. Optional Ollama/Open Terminal version checks used short-lived,\nnetwork-disabled containers without live data mounts; they were not deployments.</p>\n<h3 id=\"passed\">Passed</h3>\n<ul>\n<li>Compose validation for the core stack and all optional profiles.</li>\n<li>Network/storage checks: no database, vector, extraction, terminal or Ollama host\n  ports; default web/admin bindings on loopback; private data network; proxy only\n  on the edge network; project-scoped volumes and no fixed container names.</li>\n<li>Four setup regression tests: independent random credentials and mode 0600,\n  preservation of an existing .env, preservation of symlinks without following\n  them, and rejection of configuration-injection input.</li>\n<li>Fresh PostgreSQL initialization and both applications' database migrations.</li>\n<li>Separate application logins, non-superuser roles, and cross-database denial.</li>\n<li>Open WebUI 0.11.1 health, generated administrator login, and disabled signup.</li>\n<li>LiteLLM authenticated model listing and rejection of unauthenticated access.</li>\n<li>Authenticated Qdrant access and rejection of unauthenticated access.</li>\n<li>Tika extraction of a synthetic text document.</li>\n<li>Synthetic file upload through Open WebUI, file processing, and embeddings stored\n  in Qdrant using the bundled local embedding model.</li>\n<li>Full stack stop/start followed by repeated infrastructure checks, administrator\n  login, and confirmation that document vectors persisted.</li>\n<li>Shell syntax, staged whitespace checks, and source comparison against generated\n  secrets and known original-deployment identifiers.</li>\n<li>Pre-publication scan of the staged source using Gitleaks 8.30.1: no leaks found.\n  The scanner download was checked against its published SHA-256 checksum.</li>\n<li>Documentation shell examples passed Bash syntax checking; all optional Compose\n  profiles and setup regression tests were rechecked before publication.</li>\n</ul>\n<p>Embedding downloads were disabled during the isolated test with\nHF_HUB_OFFLINE=1. The pinned image's bundled embedding model was available.\nThe normal starter does not force offline mode.</p>\n<h3 id=\"not-tested\">Not tested</h3>\n<ul>\n<li>Real provider credentials, paid inference, virtual-key budgets, or chat answers\n  and citations. Configure a model and complete the README's user-facing tests.</li>\n<li>NPM deployment, public DNS, certificate issuance, or reverse-proxy browser flows.</li>\n<li>Optional Ollama inference/GPU configuration, Open Terminal, or browser add-on\n  integration with this new stack. Those profiles received configuration checks;\n  browsers are supplied by the separate Browser Workspace repository.</li>\n<li>Other CPU architectures, PostgreSQL major upgrades, or backup restoration.</li>\n<li>A vulnerability audit of upstream images. Source scanning does not audit image\n  dependencies or guarantee that every possible secret pattern is detected.</li>\n</ul>\n<p>Run <code>python3 -m unittest discover -s tests -v</code> for local setup regression tests.\nRun <code>./scripts/check.sh</code> after starting the core stack for infrastructure checks.\nThat script performs read-only checks and does not call a model or upload files.</p>"}, "security": {"title": "Security & data boundaries", "nav": "Security", "group": "Reference", "description": "Keep private data, provider credentials, and optional action-capable tools under deliberate control.", "icon": "›", "html": "<h2 id=\"deployment-boundaries\">Deployment boundaries</h2>\n<p>This starter contains no production data, provider keys, organization branding,\ninternal domains, or copied Git history. Generate fresh credentials with setup.sh.</p>\n<ul>\n<li>.env is private, ignored by Git, and created with mode 0600. Docker administrators\n  can inspect container environments. Use a secret manager for stronger controls.</li>\n<li>PostgreSQL, Qdrant and Tika have no published ports and use an internal network.\n  The application and gateway also have an outbound-capable network for providers.</li>\n<li>Qdrant requires an API key. PostgreSQL applications have distinct non-superuser\n  roles and cannot connect to each other's application database.</li>\n<li>Open WebUI and LiteLLM listen on host loopback by default. Signup is disabled;\n  setup generates an initial administrator password. Restrict new users deliberately.</li>\n<li>LiteLLM master keys are administrative credentials. Give Open WebUI a virtual\n  key with explicit model access, budget and rate limits. Provider-side spend\n  controls remain useful; budget checks are not a guarantee of zero overspend.</li>\n<li>Keep LITELLM_SALT_KEY with your encrypted backups. Changing it can make stored\n  provider credentials unreadable. Do not regenerate .env on an existing database.</li>\n<li>Optional terminal and browser services execute actions and may retain sessions.\n  Restrict them to trusted administrators. They are not per-user sandboxes.</li>\n<li>NPM's admin port stays on loopback even when public HTTP/HTTPS is enabled.\n  TLS certificates and the proxy database are sensitive runtime data.</li>\n<li>Profiles and Docker networks are not comprehensive security boundaries. Apply\n  egress controls or dedicated hosts for untrusted workloads.</li>\n<li>Never publish volumes, database dumps, log archives, or baseline snapshots.\n  Report issues without real credentials or private page/chat content.</li>\n</ul>\n<p>No automatic reset or volume-deletion scripts are included. A new project name\ncreates separate volumes; it does not migrate or erase an existing deployment.</p>"}, "troubleshooting": {"title": "Troubleshooting", "nav": "Troubleshooting", "group": "Reference", "description": "Check configuration, service readiness, and model access before changing existing data.", "icon": "›", "html": "<h2 id=\"common-symptoms\">Common symptoms</h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom</th>\n<th>Check</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Required variable missing</td>\n<td>Run setup; do not copy the example unchanged.</td>\n</tr>\n<tr>\n<td>Address already in use</td>\n<td>Choose free loopback ports in .env, then recreate the affected services.</td>\n</tr>\n<tr>\n<td>PostgreSQL rejects credentials</td>\n<td>Existing volumes retain their original passwords. Do not regenerate .env.</td>\n</tr>\n<tr>\n<td>Init script failed</td>\n<td>Inspect PostgreSQL logs; initialization does not automatically resume partially completed scripts. Preserve existing data before recovery.</td>\n</tr>\n<tr>\n<td>No models in Open WebUI</td>\n<td>Add/test a LiteLLM model, grant it to the virtual key and update the Open WebUI connection.</td>\n</tr>\n<tr>\n<td>LiteLLM rejects a request</td>\n<td>Use an active virtual key with model access and check its budget. The UI password is not an API key.</td>\n</tr>\n<tr>\n<td>.env setting seems ignored</td>\n<td>Check exported shell overrides and Open WebUI's persisted Admin UI settings.</td>\n</tr>\n<tr>\n<td>Document ingestion fails</td>\n<td>Run check.sh, inspect Tika/Qdrant logs and verify embedding model availability.</td>\n</tr>\n<tr>\n<td>Remote browser cannot open localhost URL</td>\n<td>Use an SSH tunnel; localhost refers to the machine running the browser.</td>\n</tr>\n<tr>\n<td>Proxy reports 502</td>\n<td>Use service open-webui and container port 8080; verify the application is healthy.</td>\n</tr>\n</tbody>\n</table></div>\n<p>Use <code>docker compose config --quiet</code> for validation. Plain <code>docker compose config</code>\nprints resolved secrets. Review logs before sharing them. This starter has no\nlive-data migration and does not connect automatically to any existing deployment.</p>"}};
const sidebar=document.querySelector('.sidebar');let group='';sidebar.innerHTML=Object.entries(pages).map(([id,p])=>{let heading=p.group!==group?`<div class="navgroup">${p.group}</div>`:'';group=p.group;return heading+`<a class="navlink" href="#${id}" data-page="${id}"><span class="navicon" aria-hidden="true">${p.icon}</span>${p.nav}</a>`}).join('')+`<div class="sidebarfoot"><strong>Open WebUI Stack Starter</strong>Fresh setup. Your configuration.<br><a href="${repo}" target="_blank" rel="noopener noreferrer">View source on GitHub ↗</a></div>`;
function render(){const id=location.hash.slice(1).split('/')[0]||'overview';if(!pages[id])return;const p=pages[id];document.title=p.nav+' — Stack Starter';document.querySelector('#main').innerHTML=`<div class="breadcrumb">Docs <span>›</span> ${p.group} <span>›</span><span>${p.nav}</span></div><div class="eyebrow">${id==='overview'?'Self-hosted AI workspace':p.group}</div><h1>${p.title}</h1><p class="lead">${p.description}</p>${p.html}<footer><span>Stack Starter · Documentation</span><a href="${repo}/blob/main/README.md" target="_blank" rel="noopener noreferrer">Source documentation ↗</a></footer>`;document.querySelectorAll('.tags span').forEach(el=>el.classList.add('tag'));document.querySelectorAll('.navlink').forEach(a=>{a.classList.toggle('active',a.dataset.page===id);a.setAttribute('aria-current',a.dataset.page===id?'page':'false')});document.querySelector('.toc').innerHTML='<strong>On this page</strong>'+[...document.querySelectorAll('h2[id],h3[id]')].map(h=>`<a href="#${id}/${h.id}" data-section="${h.id}">${h.textContent}</a>`).join('')+`<div class="help">Make these docs better.<a href="${repo}/issues" target="_blank" rel="noopener noreferrer">Open an issue ↗</a><a href="${repo}/blob/main/README.md" target="_blank" rel="noopener noreferrer">View source ↗</a></div>`;sidebar.classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false');const section=location.hash.split('/')[1];if(section)document.getElementById(section)?.scrollIntoView();else window.scrollTo(0,0);}
window.addEventListener('hashchange',render);render();
document.querySelector('.menu').onclick=e=>{let open=sidebar.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open)};
document.addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;const text=b.closest('.codebox').querySelector('code').textContent;try{await navigator.clipboard.writeText(text);b.textContent='Copied ✓';document.querySelector('#announce').textContent='Code copied';}catch{const range=document.createRange();range.selectNodeContents(b.closest('.codebox').querySelector('code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);b.textContent='Selected — use Ctrl/Cmd+C';} });
const dialog=document.querySelector('#searchDialog'),input=document.querySelector('#searchInput');function search(){let q=input.value.trim().toLowerCase();let matches=Object.entries(pages).filter(([id,p])=>(p.title+' '+p.nav+' '+p.description+' '+p.html.replace(/<[^>]*>/g,' ')).toLowerCase().includes(q));document.querySelector('#results').innerHTML=matches.length?matches.map(([id,p])=>`<a href="#${id}"><strong>${p.nav}</strong><small>${p.description}</small></a>`).join(''):'<p style="padding:12px">No matching pages. Try “model”, “password”, or “backup”.</p>';}function openSearch(){dialog.showModal();input.value='';search();input.focus()}document.querySelector('.searchTrigger').onclick=openSearch;document.querySelector('#closeSearch').onclick=()=>dialog.close();input.oninput=search;document.querySelector('#results').onclick=e=>{if(e.target.closest('a'))dialog.close()};dialog.onclick=e=>{if(e.target===dialog)dialog.close()};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){sidebar.classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false')}});
</script></body></html>
